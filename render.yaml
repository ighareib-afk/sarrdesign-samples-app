services:
  - type: web
    name: sarrdesign-samples
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
    disk:
      name: sarrdesign-data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1
